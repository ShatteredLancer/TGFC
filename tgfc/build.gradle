apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion '26.0.2'

    defaultConfig {
        applicationId "net.jejer.tgfc.ng"
        minSdkVersion 14
        targetSdkVersion 28
        versionCode 28
        versionName '1.4.4'
    }

    // Release credentials stay outside the repository. Set TGFC_RELEASE_SIGNING_FILE to an
    // external properties file, or place it at ~/.tgfc/release-signing.properties.
    def releaseSigningProperties = new Properties()
    def releaseSigningPath = System.getenv('TGFC_RELEASE_SIGNING_FILE')
    if (releaseSigningPath == null || releaseSigningPath.trim().isEmpty()) {
        releaseSigningPath = new File(System.getProperty('user.home'), '.tgfc/release-signing.properties').absolutePath
    }
    def releaseSigningFile = file(releaseSigningPath)
    if (releaseSigningFile.exists()) {
        releaseSigningFile.withInputStream { releaseSigningProperties.load(it) }
    }
    def releaseStoreFile = releaseSigningProperties.getProperty('storeFile')
    def releaseStorePassword = releaseSigningProperties.getProperty('storePassword')
    def releaseKeyAlias = releaseSigningProperties.getProperty('keyAlias')
    def releaseKeyPassword = releaseSigningProperties.getProperty('keyPassword')
    def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
            .every { value -> value != null && !value.trim().isEmpty() }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            zipAlignEnabled true
            shrinkResources false
            if (hasReleaseSigning)
                signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
            applicationVariants.all { variant ->
                variant.outputs.each { output ->
                    output.outputFile = new File(output.outputFile.parent,
                            output.outputFile.name.replace("-release", "-ng-release-" + versionName)
                    )
                }
            }
        }
        debug {
            applicationIdSuffix ".test"
            versionNameSuffix "-test"
        }
    }
}

dependencies {
    compile 'org.jsoup:jsoup:1.8.3'
    compile('com.squareup.okhttp:okhttp:2.7.0') {
        exclude group: 'com.squareup.okio'
    }
    compile 'pl.droidsonroids.gif:android-gif-drawable:1.1.15'
    //compile 'com.squareup.okio:okio:1.7.0-SNAPSHOT'
    compile 'com.github.bumptech.glide:glide:3.6.1'
    //compile 'com.github.bumptech.glide:okhttp-integration:1.3.0'
    compile 'com.birbit:android-priority-jobqueue:1.3.4'
    compile 'de.greenrobot:eventbus:2.4.0'
    compile 'com.davemorrissey.labs:subsampling-scale-image-view:3.4.1'
    compile 'com.github.clans:fab:1.6.1'
    compile('com.mikepenz:materialdrawer:6.0.9@aar') { transitive = true }
    //compile 'com.mikepenz:iconics-core:2.9.0@aar'
    compile 'com.mikepenz:iconics-views:2.9.5@aar'
    compile 'com.mikepenz:google-material-typeface:2.2.0.1@aar'
    compile 'com.mikepenz:fontawesome-typeface:4.4.0.1@aar'
    compile 'uk.co.chrisjenx:calligraphy:2.1.0'
    compile 'com.android.support:appcompat-v7:27.1.1'
    compile('ch.acra:acra:4.7.0-RC.1') {
        exclude group: 'org.json'
    }
    compile fileTree(dir: 'libs', include: ['*.jar'])
}
